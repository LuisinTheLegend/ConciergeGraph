name: Publish to PyPI

on:
  release:
    types: [published]

permissions: {}

jobs:
  build:
    name: Build sdist and wheel
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python 3.12
      uses: actions/setup-python@v5
      with:
        python-version: "3.12"

    - name: Verify release tag matches pyproject.toml version
      env:
        RELEASE_TAG: ${{ github.event.release.tag_name }}
      run: |
        python - <<'PY'
        import os
        import sys
        import tomllib

        tag = os.environ.get("RELEASE_TAG", "").strip()
        if not tag.startswith("v"):
            sys.exit(f"Release tag must start with 'v', got: {tag!r}")

        tag_version = tag[1:]
        with open("pyproject.toml", "rb") as fh:
            pkg_version = tomllib.load(fh)["project"]["version"]

        if tag_version != pkg_version:
            sys.exit(
                f"Version mismatch: release tag {tag!r} ({tag_version}) "
                f"!= pyproject.toml ({pkg_version})"
            )

        print(f"Verified release tag {tag} matches pyproject.toml version {pkg_version}")
        PY

    - name: Install build and twine
      run: python -m pip install --upgrade pip build twine

    - name: Build distributions
      run: python -m build --outdir dist

    - name: Check distributions
      run: twine check --strict dist/*

    - name: Upload distribution artifacts
      uses: actions/upload-artifact@v4
      with:
        name: pypi-dist
        path: dist/
        retention-days: 5

  publish:
    name: Publish to PyPI (OIDC)
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: pypi
      url: https://pypi.org/project/concierge-graph/
    permissions:
      id-token: write

    steps:
    - name: Download distribution artifacts
      uses: actions/download-artifact@v4
      with:
        name: pypi-dist
        path: dist/

    - name: Publish package distributions to PyPI
      uses: pypa/gh-action-pypi-publish@release/v1
      with:
        packages-dir: dist/
