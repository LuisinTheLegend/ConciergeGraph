services:
  concierge:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: concierge-graph
    restart: unless-stopped
    ports:
      - "${CONCIERGE_BIND_ADDRESS:-127.0.0.1}:8000:8000"
    environment:
      - GRAFO_HOST=0.0.0.0
      - GRAFO_PORT=8000
      - GRAFO_TRANSPORT=sse
      - GRAFO_DB_PATH=/app/data/concierge.db
      - GRAFO_CHROMA_PATH=/app/data/chroma
      - GRAFO_DEFAULT_STATE=${GRAFO_DEFAULT_STATE:-PLANNING}
      - GRAFO_AGENT_TOKEN=${GRAFO_AGENT_TOKEN:-}
      - GRAFO_LLM_API_KEY=${GRAFO_LLM_API_KEY:-}
      - GRAFO_LLM_MODEL=${GRAFO_LLM_MODEL:-gemini-2.0-flash}
      - GRAFO_VECTOR_BACKEND=${GRAFO_VECTOR_BACKEND:-chroma}
      - GRAFO_API_KEY=${GRAFO_API_KEY:-}
      - GRAFO_CORS_ORIGINS=${GRAFO_CORS_ORIGINS:-*}
    volumes:
      - concierge_data:/app/data
    healthcheck:
      test: ["CMD", "python", "-c", "import os, urllib.request; port = os.environ.get('GRAFO_PORT', '8000'); resp = urllib.request.urlopen(f'http://127.0.0.1:{port}/health', timeout=5); raise SystemExit(0 if resp.status == 200 else 1)"]
      interval: 30s
      timeout: 10s
      start_period: 15s
      retries: 3

  # Optional Qdrant Vector DB Service
  # Uncomment below to run local Qdrant cluster alongside Grafo Concierge
  # qdrant:
  #   image: qdrant/qdrant:latest
  #   container_name: concierge-qdrant
  #   restart: unless-stopped
  #   ports:
  #     - "${CONCIERGE_BIND_ADDRESS:-127.0.0.1}:6333:6333"
  #     - "${CONCIERGE_BIND_ADDRESS:-127.0.0.1}:6334:6334"
  #   volumes:
  #     - ./data/qdrant_storage:/qdrant/storage

volumes:
  concierge_data:
